<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grace Charis - Exclusive Content</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 999;
            pointer-events: none;
        }
        
        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: 100px;
            color: rgba(255, 255, 255, 0.02);
            font-weight: bold;
            z-index: 998;
            pointer-events: none;
            white-space: nowrap;
            letter-spacing: 30px;
        }
        
        .ad-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }
        
        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .slide.active {
            opacity: 1;
            z-index: 2;
        }
        
        .slide-image {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
            border-radius: 20px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.7);
            pointer-events: none;
            -webkit-touch-callout: none;
            animation: zoomIn 2s ease-out;
        }
        
        @keyframes zoomIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .slide::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, 
                transparent 30%, 
                rgba(255, 215, 0, 0.05) 50%, 
                transparent 70%);
            animation: elegantShimmer 4s infinite;
            pointer-events: none;
        }
        
        @keyframes elegantShimmer {
            0% { transform: translateX(-100%) translateY(-100%); }
            100% { transform: translateX(100%) translateY(100%); }
        }
        
        .vip-badge {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: white;
            padding: 18px 50px;
            border-radius: 50px;
            font-size: 26px;
            font-weight: bold;
            z-index: 100;
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.5);
            animation: gentlePulse 3s infinite ease-in-out;
            pointer-events: none;
            letter-spacing: 2px;
        }
        
        @keyframes gentlePulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.03); }
        }
        
        .timer {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 22px 50px;
            border-radius: 50px;
            font-size: 22px;
            font-weight: bold;
            z-index: 100;
            backdrop-filter: blur(10px);
            pointer-events: none;
            border: 2px solid rgba(255, 215, 0, 0.3);
        }
        
        .timer span {
            color: #FFD700;
            font-size: 28px;
        }
        
        .exclusive-text {
            position: fixed;
            bottom: 140px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 20px;
            text-align: center;
            z-index: 100;
            text-shadow: 2px 2px 15px rgba(0,0,0,0.9);
            pointer-events: none;
            animation: softGlow 4s infinite ease-in-out;
            letter-spacing: 1px;
        }
        
        @keyframes softGlow {
            0%, 100% { opacity: 0.7; text-shadow: 2px 2px 15px rgba(0,0,0,0.9); }
            50% { opacity: 1; text-shadow: 0 0 20px rgba(255, 215, 0, 0.6); }
        }
        
        .screenshot-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 997;
            pointer-events: none;
            display: none;
        }
        
        body.screenshot-detected .screenshot-overlay {
            display: block;
            animation: flashWarning 0.3s;
        }
        
        @keyframes flashWarning {
            0%, 100% { background: transparent; }
            50% { background: rgba(255, 0, 0, 0.3); }
        }
        
        .end-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 1s ease-in;
        }
        
        .end-screen.show {
            display: flex;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .end-content {
            text-align: center;
            color: white;
            animation: slideUp 1s ease-out;
        }
        
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .end-icon {
            font-size: 100px;
            margin-bottom: 30px;
            animation: bounceIn 1s ease-out;
        }
        
        @keyframes bounceIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        .end-title {
            font-size: 52px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }
        
        .end-subtitle {
            font-size: 26px;
            opacity: 0.9;
            margin-bottom: 15px;
        }
        
        .end-message {
            font-size: 20px;
            opacity: 0.7;
            margin-top: 30px;
            font-style: italic;
        }
        
        .loading-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="loading-screen" id="loadingScreen">
        <div style="text-align: center;">
            <div style="font-size: 60px; margin-bottom: 20px;">⏳</div>
            <div>Loading exclusive content...</div>
        </div>
    </div>

    <div class="watermark">GRACE CHARIS EXCLUSIVE</div>
    <div class="screenshot-overlay"></div>
    
    <div class="vip-badge">
        👑 VIP EXCLUSIVE CONTENT 👑
    </div>
    
    <div class="exclusive-text">
        ✨ For Your Eyes Only - Private Content ✨
    </div>
    
    <div class="timer" id="timer" style="display: none;">
        ⏱️ Viewing Time: <span id="countdown">60</span>s
    </div>
    
    <div class="ad-container" id="adContainer" style="display: none;">
        <!-- Slides will be generated here -->
    </div>
    
    <div class="end-screen" id="endScreen">
        <div class="end-content">
            <div class="end-icon">✨</div>
            <div class="end-title">Thank You!</div>
            <div class="end-subtitle">This exclusive content has ended.</div>
            <div class="end-message">Grace Charis VIP Experience</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyD5Z_YbfJs1LTZVqq8IDLUWakGmj5b96UE",
            authDomain: "grace-fan-cards.firebaseapp.com",
            databaseURL: "https://grace-fan-cards-default-rtdb.firebaseio.com",
            projectId: "grace-fan-cards",
            storageBucket: "grace-fan-cards.firebasestorage.app",
            messagingSenderId: "982523155231",
            appId: "1:982523155231:web:472627226297f11ebb162a"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        let currentSlide = 0;
        let totalTime = 60;
        let timeRemaining = totalTime;
        let slideInterval;
        let timerInterval;

        // Load photos from Firebase
        const photosRef = ref(database, 'exclusivePhotos');
        onValue(photosRef, (snapshot) => {
            const photos = snapshot.val();
            
            if (!photos || Object.keys(photos).length === 0) {
                // No photos available
                document.getElementById('loadingScreen').innerHTML = `
                    <div style="text-align: center; padding: 40px;">
                        <div style="font-size: 60px; margin-bottom: 20px;">📸</div>
                        <div style="font-size: 24px; margin-bottom: 15px;">No Content Available</div>
                        <div style="font-size: 16px; opacity: 0.7;">Check back later for exclusive content!</div>
                    </div>
                `;
                return;
            }

            // Get image URLs
            const images = Object.values(photos).map(p => p.url);
            
            // Hide loading, show content
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('adContainer').style.display = 'block';
            document.getElementById('timer').style.display = 'block';
            
            // Create slides
            const container = document.getElementById('adContainer');
            images.forEach((imgUrl, index) => {
                const slide = document.createElement('div');
                slide.className = 'slide' + (index === 0 ? ' active' : '');
                slide.innerHTML = `<img src="${imgUrl}" class="slide-image" draggable="false" alt="Grace Charis Exclusive">`;
                container.appendChild(slide);
            });
            
            const slides = document.querySelectorAll('.slide');
            
            // Auto-rotate slides every 5 seconds
            slideInterval = setInterval(() => {
                slides[currentSlide].classList.remove('active');
                currentSlide = (currentSlide + 1) % slides.length;
                slides[currentSlide].classList.add('active');
            }, 5000);
            
            // Countdown timer
            const countdownEl = document.getElementById('countdown');
            timerInterval = setInterval(() => {
                timeRemaining--;
                countdownEl.textContent = timeRemaining;
                
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    clearInterval(slideInterval);
                    document.getElementById('endScreen').classList.add('show');
                }
            }, 1000);
        });
        
        // PROTECTION: Disable right-click
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            return false;
        });
        
        // PROTECTION: Disable keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.keyCode === 123 ||
                (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) ||
                (e.ctrlKey && e.keyCode === 85) ||
                (e.ctrlKey && e.keyCode === 83)) {
                e.preventDefault();
                return false;
            }
            
            if (e.keyCode === 44 ||
                (e.metaKey && e.shiftKey && e.keyCode === 83) ||
                (e.metaKey && e.shiftKey && e.keyCode === 52) ||
                (e.metaKey && e.shiftKey && e.keyCode === 51)) {
                document.body.classList.add('screenshot-detected');
                setTimeout(() => {
                    document.body.classList.remove('screenshot-detected');
                }, 300);
            }
        });
        
        // PROTECTION: Disable drag
        document.addEventListener('dragstart', (e) => {
            e.preventDefault();
            return false;
        });
        
        // PROTECTION: Prevent long-press on mobile
        document.addEventListener('touchstart', (e) => {
            if (e.target.tagName === 'IMG') {
                e.preventDefault();
            }
        });
        
        document.addEventListener('touchend', (e) => {
            if (e.target.tagName === 'IMG') {
                e.preventDefault();
            }
        });
        
        // PROTECTION: Disable text selection
        document.onselectstart = () => false;
    </script>
</body>
</html>
