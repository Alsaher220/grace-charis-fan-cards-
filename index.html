<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Experience VIP Access</title>
  <style>
    body {
      background: radial-gradient(circle at center, #000, #0a0a0a);
      color: white;
      font-family: "Poppins", sans-serif;
      overflow: hidden;
      text-align: center;
      height: 100vh;
      margin: 0;
    }
    .centered {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .shimmer {
      background: linear-gradient(90deg, #fff, #f0f0f0, #fff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 3s linear infinite;
      font-size: 2.2em;
      font-weight: 700;
    }
    @keyframes shimmer {
      to {
        background-position: 200% center;
      }
    }
    .timer {
      font-size: 1.4em;
      margin-top: 1em;
      font-weight: 500;
    }
    .vip {
      position: fixed;
      top: 10px;
      right: 10px;
      font-size: 1.5em;
      background: linear-gradient(45deg, gold, orange);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }
    #musicToggle {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      padding: 10px;
      cursor: pointer;
      transition: 0.3s;
    }
    #musicToggle:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    #musicToggle.muted {
      opacity: 0.5;
    }
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 1.5em;
      z-index: 999;
    }
  </style>
</head>
<body>
  <div class="vip">VIP 🔱</div>
  <div class="centered">
    <div class="shimmer">Welcome to Nova Experience</div>
    <div class="timer" id="countdown"></div>
  </div>

  <div id="overlay">🎵 Tap to Start VIP Music 🎵</div>

  <audio id="bgMusic" loop playsinline>
    <source src="https://cdn.pixabay.com/audio/2024/03/18/audio_3b1e1a5dd3.mp3" type="audio/mpeg">
  </audio>

  <div id="musicToggle">🔊</div>

  <script>
    const audio = document.getElementById('bgMusic');
    const musicToggle = document.getElementById('musicToggle');
    const overlay = document.getElementById('overlay');
    let musicPlaying = false;

    // Start background music
    function startMusic() {
      audio.volume = 1.0;
      audio.play().then(() => {
        musicPlaying = true;
        musicToggle.textContent = '🔊';
        musicToggle.classList.remove('muted');
      }).catch(() => {
        overlay.style.display = 'flex';
        overlay.addEventListener('click', () => {
          overlay.style.display = 'none';
          audio.play();
          musicPlaying = true;
          musicToggle.textContent = '🔊';
          musicToggle.classList.remove('muted');
        }, { once: true });
      });
    }

    // Countdown timer (you can customize the date/time)
    const targetDate = new Date(Date.now() + 3600 * 1000);
    const countdown = document.getElementById('countdown');
    setInterval(() => {
      const diff = targetDate - new Date();
      if (diff <= 0) {
        countdown.textContent = "Event Live Now 🎉";
        return;
      }
      const h = Math.floor(diff / (1000 * 60 * 60));
      const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((diff % (1000 * 60)) / 1000);
      countdown.textContent = `${h}h ${m}m ${s}s`;
    }, 1000);

    // Handle music toggle button
    musicToggle.addEventListener('click', () => {
      if (musicPlaying) {
        audio.pause();
        musicPlaying = false;
        musicToggle.textContent = '🔇';
        musicToggle.classList.add('muted');
      } else {
        audio.play();
        musicPlaying = true;
        musicToggle.textContent = '🔊';
        musicToggle.classList.remove('muted');
      }
    });

    // Start automatically on supported devices
    window.addEventListener('load', startMusic);
  </script>
</body>
</html>
