    body {
        background: #000;

        font-family: 'Arial', sans-serif;

    /* Prevent right-click and screenshot overlay */
    body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        z-index: 999;
        pointer-events: none;
    }
    
    .watermark {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(-45deg);
        font-size: 100px;
        color: rgba(255, 255, 255, 0.02);
        font-weight: bold;
        z-index: 998;
        pointer-events: none;
        white-space: nowrap;
        letter-spacing: 30px;
    }
    
    .ad-container {
        width: 100vw;
        height: 100vh;
        position: relative;
        overflow: hidden;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    }
    
    .slide {
        position: absolute;
        width: 100%;
        height: 100%;
        opacity: 0;
        transition: opacity 2s ease-in-out;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .slide.active {
        opacity: 1;
        z-index: 2;
    }
    
    .slide-image {
        max-width: 85%;
        max-height: 85%;
        object-fit: contain;
        border-radius: 20px;
        box-shadow: 0 30px 80px rgba(0,0,0,0.7);
        pointer-events: none;
        -webkit-touch-callout: none;
        animation: zoomIn 2s ease-out;
    }
    
    @keyframes zoomIn {
        0% { transform: scale(0.9); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }
    
    /* Elegant shimmer effect */
    .slide::before {
        content: '';
        position: absolute;

<div class="vip-badge">
    👑 VIP EXCLUSIVE CONTENT 👑
</div>

<div class="exclusive-text">
    ✨ For Your Eyes Only - Private Content ✨
</div>

<div class="timer" id="timer">
    ⏱️ Viewing Time: <span id="countdown">45</span>s
</div>

<div class="ad-container" id="adContainer">
    <!-- Slides will be generated here -->
</div>

<div class="end-screen" id="endScreen">
    <div class="end-content">
        <div class="end-icon">✨</div>
        <div class="end-title">Thank You!</div>
        <div class="end-subtitle">This exclusive content has ended.</div>
        <div class="end-message">Grace Charis VIP Experience</div>
    </div>
</div>

<script>
    // Grace Charis exclusive photos
    const images = [
        'https://i.postimg.cc/0Nww2Wpy/IMG-8986.jpg',
        'https://i.postimg.cc/1zqq5CpV/IMG-8982.jpg'
    ];
    
    let currentSlide = 0;
    let totalTime = 45; // 45 seconds total viewing time
    let timeRemaining = totalTime;
    
    // Create slides
    const container = document.getElementById('adContainer');
    images.forEach((imgUrl, index) => {
        const slide = document.createElement('div');
        slide.className = 'slide' + (index === 0 ? ' active' : '');
        slide.innerHTML = `<img src="${imgUrl}" class="slide-image" draggable="false" alt="Grace Charis Exclusive">`;
        container.appendChild(slide);
    });
    
    const slides = document.querySelectorAll('.slide');
    
    // Auto-rotate slides every 5 seconds with smooth transition
    setInterval(() => {
        slides[currentSlide].classList.remove('active');
        currentSlide = (currentSlide + 1) % slides.length;
        slides[currentSlide].classList.add('active');
    }, 5000);
    
    // Countdown timer
    const countdownEl = document.getElementById('countdown');
    const timerInterval = setInterval(() => {
        timeRemaining--;
        countdownEl.textContent = timeRemaining;
        
        if (timeRemaining <= 0) {
            clearInterval(timerInterval);
            // Show beautiful end screen
            document.getElementById('endScreen').classList.add('show');
        }
    }, 1000);
    
    // PROTECTION: Disable right-click
    document.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        return false;
    });
    
    // PROTECTION: Disable common keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        // Prevent F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U, Ctrl+S
        if (e.keyCode === 123 || // F12
            (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || // Ctrl+Shift+I/J
            (e.ctrlKey && e.keyCode === 85) || // Ctrl+U
            (e.ctrlKey && e.keyCode === 83)) { // Ctrl+S
            e.preventDefault();
            return false;
        }
        
        // Detect screenshot attempts (Print Screen, Windows+Shift+S, etc.)
        if (e.keyCode === 44 || // Print Screen
            (e.metaKey && e.shiftKey && e.keyCode === 83) || // Mac screenshot
            (e.metaKey && e.shiftKey && e.keyCode === 52) || // Mac screenshot area
            (e.metaKey && e.shiftKey && e.keyCode === 51)) { // Mac screenshot
            document.body.classList.add('screenshot-detected');
            setTimeout(() => {
                document.body.classList.remove('screenshot-detected');
            }, 300);
        }
    });
    
    // PROTECTION: Disable drag and drop
    document.addEventListener('dragstart', (e) => {
        e.preventDefault();
        return false;
    });
    
    // PROTECTION: Detect if user leaves tab (might be screenshotting)
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            console.log('User left tab - possible screenshot attempt');
        }
    });
    
    // PROTECTION: Prevent long-press on mobile
    document.addEventListener('touchstart', (e) => {
        if (e.target.tagName === 'IMG') {
            e.preventDefault();
        }
    });
    
    document.addEventListener('touchend', (e) => {
        if (e.target.tagName === 'IMG') {
            e.preventDefault();
        }
    });
    
    // PROTECTION: Disable text selection
    document.onselectstart = () => false;
    
    // Preload images for smooth transition
    images.forEach(src => {
        const img = new Image();
        img.src = src;
    });
</script>
